# Site settings
title: 我的博客
SEOTitle: 我的博客
header-img: img/home-bg.jpg
email:
description: "欢迎来到我的个人博客"
keyword: "博客, 个人网站, 学习笔记"
url: "https://lyuhui115.github.io" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
github_username: lyuhui115
# weibo_username:
# zhihu_username:
# twitter_username:

# Build settings
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
  ]
anchorjs: true
# timezone issue (e.g. #68) in China, uncomment to use this:
timezone: CN

# Gems
plugins: [jekyll-paginate]

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus settings
# disqus_username:

# Netease settings
netease_comment: false

# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics
# ga_track_id: "UA-xxxxxx-xx"
# ga_domain:

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "记录学习与生活"
sidebar-avatar: https://github.com/lyuhui115.png # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 1 # A tag will be featured if the size of it is more than this condition value

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false

# Friends
friends: []
